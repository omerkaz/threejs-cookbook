<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Applies persisted theme before first paint to avoid a flash of the
      // wrong scheme. Palette values are allowlisted so corrupted storage
      // can never break styling.
      (() => {
        const root = document.documentElement;
        const palettes = new Set(["mono", "sepia", "azure", "moss", "mauve"]);
        try {
          const savedTheme = localStorage.getItem("tjc-theme");
          const lightPalette = localStorage.getItem("tjc-palette-light");
          const darkPalette = localStorage.getItem("tjc-palette-dark");
          const mode = savedTheme === "light" || savedTheme === "system" ? savedTheme : "dark";
          if (mode === "system") root.removeAttribute("data-theme");
          else root.dataset.theme = mode;
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const scheme = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
          root.dataset.scheme = scheme;
          const palette = scheme === "dark" ? darkPalette : lightPalette;
          root.dataset.palette = palette && palettes.has(palette) ? palette : "mono";
        } catch {
          root.dataset.theme = "dark";
          root.dataset.scheme = "dark";
          root.dataset.palette = "mono";
        }
      })();
    </script>
    <meta
      name="description"
      content="An open cookbook of interactive Three.js recipes — geometry, particles, shaders, lighting, and animation studies with live previews, tweakable props, and copyable source."
    />
    <link rel="icon" href="./cookbook-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Three.js Cookbook — Interactive WebGL Recipes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
